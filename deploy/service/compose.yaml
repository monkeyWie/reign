services:
  reignhub-server:
    build:
      context: ../..
      dockerfile: deploy/service/Dockerfile
      args:
        VERSION: ${REIGNHUB_VERSION:-dev}
    restart: unless-stopped
    volumes:
      - device-data:/data
      - ./config.json:/config.json:ro
    ports:
      - "${REIGNHUB_HTTP_PORT:-26330}:26330/tcp"
      - "${REIGNHUB_UDP_PORT:-26331}:26331/udp"
      - "${REIGNHUB_TCP_PORT:-26331}:26331/tcp"
      - "${REIGNHUB_NATIVE_UDP_PORT:-${REIGNHUB_NATIVE_PORT:-26332}}:26332/udp"
      - "${REIGNHUB_NATIVE_TCP_PORT:-${REIGNHUB_NATIVE_PORT:-26332}}:26332/tcp"
volumes:
  device-data:
