services:
  reignhub-server:
    build:
      context: ../..
      dockerfile: deploy/service/Dockerfile
      args:
        VERSION: ${REIGNHUB_VERSION:-dev}
    restart: unless-stopped
    volumes:
      - device-data:/data
    ports:
      - "${REIGNHUB_HTTP_PORT:-26330}:26330/tcp"
      - "${REIGNHUB_UDP_PORT:-26331}:26331/udp"
      - "${REIGNHUB_TCP_PORT:-26331}:26331/tcp"
    command:
      - "--state=/data/reignhub.db"
      - "--self-stun=${REIGNHUB_SELF_STUN:-}"
      - "--tcp-stun-public=${REIGNHUB_TCP_STUN:-}"
volumes:
  device-data:
