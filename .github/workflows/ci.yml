name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve and validate version
        id: version
        run: python3 scripts/ci/release.py metadata
      - name: Validate build helpers
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m py_compile scripts/platform/package-server.py scripts/build-android-host.py
          sh -n scripts/build.sh scripts/go-toolexec.sh scripts/platform/install-server.sh

  test:
    name: Test ${{ matrix.module }} (${{ matrix.os }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        module: [core, nsgo]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.module == 'nsgo' && matrix.os == 'macos-15-intel' && 40 || 25 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb
      - name: Check Go formatting
        if: matrix.module == 'core' && runner.os == 'Linux'
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet and test with race detection
        env:
          MODULE: ${{ matrix.module }}
          TEST_TIMEOUT: ${{ matrix.module == 'nsgo' && (matrix.os == 'macos-15-intel' && '20m' || '10m') || '5m' }}
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          if [ "$MODULE" = nsgo ]; then cd clients/nsgo; fi
          go vet ./...
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a go test -race -timeout "$TEST_TIMEOUT" -coverprofile=coverage.out ./...
          else
            go test -race -timeout "$TEST_TIMEOUT" -coverprofile=coverage.out ./...
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.module }}-${{ runner.os }}
          path: |
            coverage.out
            clients/nsgo/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  windows-provider:
    name: Test Windows agent providers
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet and test Windows provider
        run: |
          go vet ./internal/system ./internal/codex ./internal/codexipc ./internal/agents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -timeout 3m ./internal/system ./internal/codex ./internal/codexipc ./internal/agents

  clients:
    name: Build ${{ matrix.name }} clients
    needs: [metadata, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            os: ubuntu-24.04
            targets: linux_x64,linux_arm64,windows_x64,windows_arm64
          - name: apple
            os: macos-15-intel
            targets: macos_arm64,macos_x64,ios,ios_simulator
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      TARGETS: ${{ matrix.targets }}
      AGENTHUB_SERVER_URL: ${{ vars.REIGNHUB_SERVER_URL || 'https://reignhub.app' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Preserve cross-target compilation separately from native test caches.
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
            scripts/build.sh
      - name: Install native installer tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full
      - name: Build native clients
        run: ./scripts/build.sh "$TARGETS" -version "$VERSION" -build-number "$BUILD_NUMBER"
      - name: Package public assets and checksums
        run: |
          python3 scripts/ci/release.py collect --source dist \
            --targets "$TARGETS" --version "$VERSION" --output dist/release
      - name: Validate native installer payloads
        run: python3 scripts/ci/smoke-installers.py --directory dist/release --version "$VERSION" --targets "$TARGETS"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: clients-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: [metadata, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      AGENTHUB_SERVER_URL: ${{ vars.REIGNHUB_SERVER_URL || 'https://reignhub.app' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore optional persistent Android signing identity
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PEM_BASE64: ${{ secrets.ANDROID_SIGNING_PEM_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_SIGNING_PEM_BASE64', '')
          if encoded:
              key = Path('clients/nsgo/.nsgo/android/debug.pem')
              key.parent.mkdir(parents=True, exist_ok=True)
              key.write_bytes(base64.b64decode(encoded, validate=True))
              key.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('REIGNHUB_ANDROID_STABLE_SIGNING=1\n')
          PY
      - name: Require persistent signing for published releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$REIGNHUB_ANDROID_STABLE_SIGNING" != "1" ]; then
            echo 'Configure ANDROID_SIGNING_PEM_BASE64 before publishing an installable release.'
            exit 1
          fi
      - name: Build APK including native QR host
        run: ./scripts/build.sh android_arm64 -version "$VERSION" -build-number "$BUILD_NUMBER"
      - name: Verify packaged APK version and signature
        run: |
          python3 - <<'PY'
          import hashlib, os, re, ssl, subprocess
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          apk = Path('dist/releases') / ('reignhub-' + os.environ['VERSION'] + '-android-arm64.apk')
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "versionName='" + os.environ['VERSION'] + "'" in badging
          assert "versionCode='" + os.environ['BUILD_NUMBER'] + "'" in badging
          assert "name='dev.agenthub.ras.RasActivity'" in badging
          manifest = subprocess.check_output([str(tools / 'aapt'), 'dump', 'xmltree', str(apk), 'AndroidManifest.xml'], text=True)
          assert 'dev.agenthub.ras.ConnectionService' in manifest
          assert 'foregroundServiceType' in manifest and '(type 0x11)0x10' in manifest
          assert 'android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE' in manifest
          assert 'android.permission.POST_NOTIFICATIONS' in manifest
          signature = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          print(signature)
          if os.environ.get('REIGNHUB_ANDROID_STABLE_SIGNING'):
              identity = Path('clients/nsgo/.nsgo/android/debug.pem').read_text()
              certificate = re.search(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', identity, re.S).group(0)
              expected = hashlib.sha256(ssl.PEM_cert_to_DER_cert(certificate)).hexdigest()
              actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', signature).group(1).lower()
              assert actual == expected, 'APK certificate does not match the configured signing identity'
              print('APK certificate matches the configured persistent signing identity')
          PY
      - name: Collect APK
        run: |
          python3 scripts/ci/release.py collect --source dist \
            --targets android_arm64 --version "$VERSION" --output dist/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: clients-android
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing identity
        if: always()
        run: rm -f clients/nsgo/.nsgo/android/debug.pem

  web:
    name: Test and build NSGo Web + Worker
    needs: [metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:web
      - name: Verify actual Worker to native host interoperability
        run: |
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler dev --port 8787 > /tmp/reignhub-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm exec tsx scripts/platform/smoke-worker.mts http://127.0.0.1:8787
      - name: Configure isolated headless Chrome
        run: |
          browser_bin=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          test -n "$browser_bin"
          echo "REIGNHUB_TEST_CHROME=$browser_bin" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/nsgo-chrome" <<'EOF'
          #!/usr/bin/env bash
          # CI has no user profile or credentials. Its restricted Linux sandbox
          # cannot always create Chromium's nested user namespace.
          exec "$REIGNHUB_TEST_CHROME" --no-sandbox --disable-dev-shm-usage "$@" 2>> "$RUNNER_TEMP/nsgo-chrome.log"
          EOF
          chmod +x "$RUNNER_TEMP/nsgo-chrome"
          echo "NSGO_BROWSER=$RUNNER_TEMP/nsgo-chrome" >> "$GITHUB_ENV"
      - name: Verify shared NSGo browser UI and real WebRTC/relay transport
        working-directory: clients/nsgo
        run: |
          go run ./testsupport/fixture > /tmp/reignhub-browser-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if IFS= read -r fixture_url < /tmp/reignhub-browser-fixture.log && [[ "$fixture_url" == http://127.0.0.1:* ]]; then break; fi
            sleep 1
          done
          if [[ "$fixture_url" != http://127.0.0.1:* ]]; then
            cat /tmp/reignhub-browser-fixture.log
            exit 1
          fi
          run_browser_test() {
            for attempt in 1 2 3; do
              if go tool nsgo test -target web "$@" > "$RUNNER_TEMP/nsgo-browser-check.log" 2>&1; then
                cat "$RUNNER_TEMP/nsgo-browser-check.log"
                return 0
              fi
              cat "$RUNNER_TEMP/nsgo-browser-check.log"
              # Retry only Chromium failing before the test suite starts.
              # Assertion failures and browser/runtime regressions still fail.
              if ! python3 - "$RUNNER_TEMP/nsgo-browser-check.log" <<'PY'
          import pathlib, sys
          output = pathlib.Path(sys.argv[1]).read_text()
          sys.exit(0 if "the browser did not open its DevTools port" in output and "built the tests" not in output else 1)
          PY
              then return 1; fi
              sleep 2
            done
            return 1
          }
          run_browser_test -env "AGENTHUB_NSGO_TEST_FIXTURE=$fixture_url" \
            -run 'TestBrowserP2PAndRelayWithExistingHost|TestBrowserDirectWithoutRelay|TestBrowserConnectDoesNotWaitForRelayOrAgentDiscovery' ./browserclient
          run_browser_test \
            -run 'TestBrowserBackStaysInCompactWorkspace|TestBrowserBackStaysInWideWorkspace|TestDesktopNavigationAndDrafts|TestPhoneNavigation|TestComposerSubmit|TestWebNativePresentationParity|TestControllerIdentityRows|TestReconnectStatusShowsAnimatedIndicator|TestImageMarkersAreNotUserMessageText|TestMessageTimesUseControllerTimezone|TestResponsiveLayoutUsesWidthAcrossPlatforms|TestMobileHeaderOverlaysMessages|TestDeviceListShowsServerPresenceWithoutConnecting|TestVerifiedConnectionImmediatelyUpdatesIconAndIgnoresStalePresence|TestSavedDeviceOpensCachedMessagesWhileConnectingAndAfterFailure|TestConnectedSlowPeerShowsCacheBeforeLiveReadsComplete|TestNoCachedSessionsShowsLoadingAndStopsAfterConnectionFailure|TestLateDiskSnapshotCannotOverwriteNewerLiveMessages|TestInstalledUnsupportedAppDoesNotOfferEnable|TestLiveTextDoesNotWaitForSnapshotsOrApprovals|TestCaughtUpRunningAgentDoesNotShowSyncDotsDuringTailRefresh|TestFirstHistoryDisplaysMessagesBeforeTheFinalResponse|TestInitialHistoryDoesNotWaitForFailedOrBlockedSubscription|TestFailedHistoryShowsRetryWhileDeviceRemainsConnected|TestInitialHistoryRejectsReplacedStreamBoundary|TestInitialHistoryBeforeLiveJoinCannotSkipTheOwnersSnapshot|TestLongHistoryReplyRendersItsPrefixAndKeepsFollowingMessagesInOrder|TestLoadingSpinnersRemainMountedDuringSyncUpdates|TestSyncDotsOverlayDoesNotMoveMessages|TestLargeProgressiveHistoryKeepsNavigationResponsive|TestSendFirstFrameDoesNotSerializeHistoryOrRehashUploads|TestReconnectPreservesLiveReplyAndReplaysFromCursor' ./hubui
      - name: Upload provider support screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: provider-support-ui
          path: clients/nsgo/hubui/.nsgo/test/screenshots/web/unsupported-codex-app-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser diagnostics
        if: failure()
        run: |
          tail -80 "$RUNNER_TEMP/nsgo-chrome.log" /tmp/reignhub-browser-fixture.log 2>/dev/null || true
      - run: pnpm exec wrangler deploy --dry-run --outdir build/worker
      - name: Package deployable Worker and NSGo assets
        run: python3 scripts/platform/package-worker.py --version "$VERSION" --output dist/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-worker
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  server:
    name: Build standalone Go servers and package manager definitions
    needs: [metadata, test, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-worker
          path: build/worker-release
      - name: Reuse the verified Web build
        run: |
          mkdir -p build/worker-console
          tar -xzf "build/worker-release/reignhub-web-worker-$VERSION.tar.gz" -C build/worker-console
          python3 scripts/platform/package-server.py --version "$VERSION" --output dist/release \
            --web-dir "build/worker-console/reignhub-web-worker-$VERSION/assets/assets/chat"
      - name: Smoke test embedded Web, SQLite and integrated TCP/UDP
        run: python3 scripts/ci/smoke-server.py --archive "dist/release/reignhub-server-$VERSION-linux-amd64.tar.gz"
      - name: Verify real encrypted Go host and TypeScript controller over relay
        run: |
          mkdir -p build/server-smoke
          tar -xzf "dist/release/reignhub-server-$VERSION-linux-amd64.tar.gz" -C build/server-smoke
          "build/server-smoke/reignhub-server-$VERSION-linux-amd64/reignhub-server" \
            --listen 127.0.0.1:18788 --state build/server-smoke/state.db \
            --stun-listen 127.0.0.1:0 --tcp-stun-listen 127.0.0.1:0 > /tmp/reignhub-go-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18788/healthz > /dev/null; then break; fi
            sleep 1
          done
          pnpm exec tsx scripts/platform/smoke-worker.mts http://127.0.0.1:18788 --go-server
      - name: Verify Docker deployment with a non-root read-only runtime
        run: |
          docker build --build-arg VERSION="$VERSION" -f deploy/service/Dockerfile -t reignhub-server:ci .
          docker run -d --rm --name reignhub-server-ci --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=64m,uid=65532,gid=65532 \
            -p 127.0.0.1:18789:26330/tcp -p 127.0.0.1:19031:26331/tcp -p 127.0.0.1:19031:26331/udp \
            reignhub-server:ci --state=/data/reignhub.db \
            --self-stun=stun:127.0.0.1:19031 --tcp-stun-public=127.0.0.1:19031
          trap 'docker rm -f reignhub-server-ci > /dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18789/healthz > /dev/null; then break; fi
            sleep 1
          done
          pnpm exec tsx scripts/platform/smoke-worker.mts http://127.0.0.1:18789 --go-server
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: servers
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  probe:
    name: Build optional Linux TCP/UDP probes
    needs: [metadata, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: python3 scripts/platform/package-probe.py --version "$VERSION" --output dist/release
      - run: python3 scripts/ci/smoke-probe.py --archive "dist/release/reignhub-probe-$VERSION-linux-amd64.tar.gz"
      - name: Add probe checksums
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/ci')
          from release import checksum
          for p in Path('dist/release').glob('*.tar.gz'): checksum(p)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: probe-linux
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify complete release bundle
    needs:
      [metadata, test, windows-provider, clients, android, probe, web, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: clients-*
          merge-multiple: true
          path: dist/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: probe-linux
          path: dist/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-worker
          path: dist/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: servers
          path: dist/release
      - name: Verify complete assets and checksums
        run: python3 scripts/ci/release.py verify --version "$VERSION" --output dist/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: dist/release
      - name: Prepare release notes
        run: |
          cat > build-notes.md <<'NOTES'
          ReignHub native clients, Cloudflare Worker with NSGo Web, standalone Go servers, and optional probes.

          - macOS DMG: open and drag ReignHub into Applications. Builds are ad hoc signed and not notarized.
          - Windows setup EXE: includes installation, shortcuts and an uninstaller.
          - Linux: DEB, Arch Linux packages and AppImage for x64 and arm64; GTK 4 is required.
          - Android packages ending in `-debug.apk` use a temporary development signing key and cannot update previous builds with another key. A configured persistent signing identity removes this suffix.
          - iOS `-unsigned.ipa` requires your own signing/provisioning before installation.
          - Standalone reignhub-server binaries embed Web, use SQLite, and enable TCP/UDP discovery by default. Configure with --config server.json or --help. Package-manager definitions are included separately.
          - Probe binaries use TCP/UDP 26331 and do not contain Web or account services.
          - Verify downloads against `SHA256SUMS` or the individual `.sha256` files.
          - Native clients default to https://reignhub.app; self-hosted services can be configured in settings. Web uses its current origin.
          NOTES
      - name: Publish only after every build succeeds
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "ReignHub $VERSION" \
              --generate-notes --notes-file build-notes.md
          fi
          gh release upload "$TAG" dist/release/* --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
