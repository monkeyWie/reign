name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve and validate version
        id: version
        run: python3 scripts/ci/release.py metadata
      - name: Validate build helpers
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m py_compile clients/nsgo/scripts/package-service.py clients/nsgo/scripts/build-android-host.py
          sh -n clients/nsgo/scripts/build.sh clients/nsgo/scripts/go-toolexec.sh

  test:
    name: Test ${{ matrix.module }} (${{ matrix.os }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        module: [core, nsgo]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb
      - name: Check Go formatting
        if: matrix.module == 'core' && runner.os == 'Linux'
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet and test with race detection
        env:
          MODULE: ${{ matrix.module }}
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          if [ "$MODULE" = nsgo ]; then cd clients/nsgo; fi
          go vet ./...
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a go test -race -timeout 5m -coverprofile=coverage.out ./...
          else
            go test -race -timeout 5m -coverprofile=coverage.out ./...
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.module }}-${{ runner.os }}
          path: |
            coverage.out
            clients/nsgo/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  clients:
    name: Build ${{ matrix.name }} clients
    needs: [metadata, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop-web
            os: ubuntu-24.04
            targets: linux_x64,linux_arm64,windows_x64,windows_arm64,web
          - name: apple
            os: macos-15
            targets: macos_arm64,macos_x64,ios,ios_simulator
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      TARGETS: ${{ matrix.targets }}
      AGENTHUB_SERVER_URL: ${{ vars.REIGN_SERVER_URL || 'http://127.0.0.1:26331' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
      - name: Build native clients
        working-directory: clients/nsgo
        run: ./scripts/build.sh "$TARGETS" -version "$VERSION" -build-number "$BUILD_NUMBER"
      - name: Package public assets and checksums
        run: |
          python3 scripts/ci/release.py collect --source clients/nsgo/dist \
            --targets "$TARGETS" --version "$VERSION" --output dist/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: clients-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: [metadata, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
      AGENTHUB_SERVER_URL: ${{ vars.REIGN_SERVER_URL || 'http://127.0.0.1:26331' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            clients/nsgo/go.sum
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore optional persistent Android signing identity
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PEM_BASE64: ${{ secrets.ANDROID_SIGNING_PEM_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('ANDROID_SIGNING_PEM_BASE64', '')
          if encoded:
              key = Path('clients/nsgo/.nsgo/android/debug.pem')
              key.parent.mkdir(parents=True, exist_ok=True)
              key.write_bytes(base64.b64decode(encoded, validate=True))
              key.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('REIGN_ANDROID_STABLE_SIGNING=1\n')
          PY
      - name: Build APK including native QR host
        working-directory: clients/nsgo
        run: ./scripts/build.sh android_arm64 -version "$VERSION" -build-number "$BUILD_NUMBER"
      - name: Verify packaged APK version and signature
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          apk = Path('clients/nsgo/dist/releases') / ('reign-' + os.environ['VERSION'] + '-android-arm64.apk')
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "versionName='" + os.environ['VERSION'] + "'" in badging
          assert "versionCode='" + os.environ['BUILD_NUMBER'] + "'" in badging
          assert "name='dev.agenthub.ras.RasActivity'" in badging
          subprocess.run([str(tools / 'apksigner'), 'verify', str(apk)], check=True)
          PY
      - name: Collect APK
        run: |
          python3 scripts/ci/release.py collect --source clients/nsgo/dist \
            --targets android_arm64 --version "$VERSION" --output dist/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: clients-android
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing identity
        if: always()
        run: rm -f clients/nsgo/.nsgo/android/debug.pem

  server:
    name: Build embedded-Web Linux servers
    needs: [metadata, clients]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      SERVER_DOMAIN: ${{ vars.REIGN_SERVER_DOMAIN || 'reign.example.com' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8.0.2
        with:
          name: clients-desktop-web
          path: build/client-assets
      - name: Build one server binary per architecture
        run: |
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('build/client-assets/reign-' + os.environ['VERSION'] + '-web.zip') as z:
              z.extractall('build/web')
          PY
          python3 clients/nsgo/scripts/package-service.py --version "$VERSION" \
            --domain "$SERVER_DOMAIN" --web-dir build/web --output build/server
          mkdir -p dist/release
          cp build/server/*.tar.gz dist/release/
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/ci/release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for path in Path('dist/release').glob('*.tar.gz'):
              module.checksum(path)
          PY
      - name: Smoke-test Linux amd64 server
        run: python3 scripts/ci/smoke-server.py --archive "dist/release/reign-server-$VERSION-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: server-linux
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, test, clients, android, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: clients-*
          merge-multiple: true
          path: dist/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-linux
          path: dist/release
      - name: Verify complete assets and checksums
        run: python3 scripts/ci/release.py verify --version "$VERSION" --output dist/release
      - name: Prepare release notes
        run: |
          cat > build-notes.md <<'NOTES'
          Reign native clients and self-hosted servers.

          - Desktop archives are portable; macOS builds are ad hoc signed and not notarized.
          - Android packages ending in `-debug.apk` use a temporary development signing key and cannot update previous builds with another key. A configured persistent signing identity removes this suffix.
          - iOS `-unsigned.ipa` requires your own signing/provisioning before installation.
          - Linux desktop requires GTK 4. Linux server binaries include Web and require no UI runtime.
          - Verify downloads against `SHA256SUMS` or the individual `.sha256` files.
          - Configure a service address after installing a native client; Web uses its current origin.
          NOTES
      - name: Publish only after every build succeeds
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Reign $VERSION" \
              --generate-notes --notes-file build-notes.md
          fi
          gh release upload "$TAG" dist/release/* --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
