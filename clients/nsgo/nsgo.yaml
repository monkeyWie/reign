name: ReignHub
id: dev.agenthub.nsgo
version: 1.0.0
build_number: 1
dev:
  target: native
build:
  output: dist
  installers: true
  jobs: 1
  targets: [macos_arm64, windows_x64, linux_x64, ios, android_arm64, web]
android:
  permissions: [android.permission.INTERNET, android.permission.CAMERA, android.permission.POST_NOTIFICATIONS]
linux:
  maintainer: "liwei <liwei2633@gmail.com>"
  summary: Remote access to your AI agents
  license: MIT
apple:
  info:
    NSCameraUsageDescription: 扫描 ReignHub 设备二维码以连接电脑。

i18n:
  dir: hubui/locales
  source: en
