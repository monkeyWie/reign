<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>ReignHub — Workspace</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/chat/__LOADING_CSS__" />
    <style>
      :root {
        --bg: #fff;
        --fg: #18181b;
        --muted: #71717a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #workspace {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
      }
      #boot[hidden] {
        display: none;
      }
      #boot-error {
        max-width: 36rem;
        padding: 24px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--fg);
      }
      #boot-error[hidden] {
        display: none;
      }
      #boot-error button {
        margin-top: 16px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      #boot-progress {
        min-height: 22px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main id="workspace" aria-label="ReignHub workspace"></main>
    <div
      id="boot"
      class="console-loading"
      role="status"
      aria-label="Opening ReignHub"
    >
      <div class="console-loading-content">
        <div class="console-loading-emblem" aria-hidden="true">
          <span class="console-loading-piece"></span
          ><span class="console-loading-piece"></span>
          <span class="console-loading-piece"></span
          ><span class="console-loading-piece"></span>
          <span class="console-loading-piece"></span
          ><span class="console-loading-piece"></span>
        </div>
        <div class="console-loading-wordmark">ReignHub</div>
        <p class="console-loading-caption" id="boot-phase">
          Opening your workspace
        </p>
        <p
          id="boot-progress"
          role="progressbar"
          aria-label="Workspace download"
          aria-valuemin="0"
          aria-valuemax="100"
        ></p>
        <div id="boot-error" hidden>
          <p></p>
          <button type="button">Try again</button>
        </div>
      </div>
    </div>
    <noscript>Enable JavaScript to open your ReignHub workspace.</noscript>
    <script type="module">
      const config = __NSGO_CONFIG__;
      const root = document.getElementById("workspace");
      const boot = document.getElementById("boot");
      const phase = document.getElementById("boot-phase");
      const progress = document.getElementById("boot-progress");
      const zh = (
        document.cookie.match(/(?:^|; )reignhub_locale=([^;]+)/)?.[1] ||
        navigator.language
      ).startsWith("zh");
      document.documentElement.lang = zh ? "zh-CN" : "en";
      const text = (en, cn) => (zh ? cn : en);
      const mb = (bytes) => (bytes / 1048576).toFixed(1) + " MB";
      const observer = new MutationObserver(() => {
        if (root.childElementCount) {
          boot.hidden = true;
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true });
      try {
        // Compress the Go module for fast delivery and CF's per-asset size limit.
        // The official NSGo loader accepts a precompiled WebAssembly.Module.
        phase.textContent = text("Downloading workspace", "正在下载工作区");
        const { downloadWasm } = await import("/assets/chat/__DOWNLOADER__");
        const bytes = await downloadWasm("/assets/chat/" + config.wasm, {
          size: config.wasmSize,
          parts: config.wasmParts,
          onProgress(loaded, total) {
            phase.textContent = text("Downloading workspace", "正在下载工作区");
            const percent = total
              ? Math.min(100, Math.floor((loaded / total) * 100))
              : 0;
            progress.textContent = total
              ? `${percent}% · ${mb(loaded)} / ${mb(total)}`
              : mb(loaded);
            if (total) progress.setAttribute("aria-valuenow", String(percent));
          },
          onRetry(attempt, loaded, total) {
            phase.textContent = text(
              "Connection interrupted · retrying",
              "下载中断，正在重试",
            );
            progress.textContent =
              text(`Retry ${attempt}/2`, `重试 ${attempt}/2`) +
              ` · ${mb(loaded)} / ${mb(total)}`;
          },
        });
        phase.textContent = text("Preparing workspace", "正在初始化工作区");
        progress.textContent = text("Download complete", "下载完成");
        progress.setAttribute("aria-valuenow", "100");
        const { mount } = await import("/assets/chat/__LOADER__");
        const module = WebAssembly.compileStreaming(
          new Response(
            bytes.stream().pipeThrough(new DecompressionStream("gzip")),
            { headers: { "Content-Type": "application/wasm" } },
          ),
        );
        await mount(root, new URL("/assets/chat/nsgo.json", location.origin).href, {
          config,
          module,
        });
        window.reignhubReady = true;
      } catch (error) {
        observer.disconnect();
        console.error(error);
        const panel = document.getElementById("boot-error");
        panel.hidden = false;
        phase.textContent = text("Unable to open workspace", "工作区加载失败");
        progress.hidden = true;
        panel.querySelector("p").textContent =
          text(
            "The download or initialization could not complete. Please retry.\n",
            "下载或初始化未能完成，请重试。\n",
          ) + error.message;
        panel.querySelector("button").textContent = text(
          "Try again",
          "重新加载",
        );
        panel.querySelector("button").onclick = () => location.reload();
        document.querySelector(".console-loading-emblem").hidden = true;
      }
    </script>
  </body>
</html>
