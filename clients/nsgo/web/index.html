<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>ReignHub — Workspace</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/console/__LOADING_CSS__">
  <style>
    :root { --bg:#fff; --fg:#18181b; --muted:#71717a; color-scheme:light; }
    @media(prefers-color-scheme:dark) { :root { --bg:#18181b; --fg:#fafafa; --muted:#a1a1aa; color-scheme:dark; } }
    * { box-sizing:border-box; }
    html,body,#workspace { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:system-ui,sans-serif; }
    #boot { position:fixed; inset:0; z-index:100; }
    #boot[hidden] { display:none; }
    #boot-error { max-width:36rem; padding:24px; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--fg); }
    #boot-error[hidden] { display:none; }
    #boot-error button { margin-top:16px; padding:8px 16px; font:inherit; cursor:pointer; }
  </style>
</head>
<body>
  <main id="workspace" aria-label="ReignHub workspace"></main>
  <div id="boot" class="console-loading" role="status" aria-label="Opening ReignHub">
    <div class="console-loading-content">
      <div class="console-loading-emblem" aria-hidden="true">
        <span class="console-loading-piece"></span><span class="console-loading-piece"></span>
        <span class="console-loading-piece"></span><span class="console-loading-piece"></span>
        <span class="console-loading-piece"></span><span class="console-loading-piece"></span>
      </div>
      <div class="console-loading-wordmark">ReignHub</div>
      <p class="console-loading-caption">Opening your workspace</p>
      <div id="boot-error" hidden><p></p><button type="button">Try again</button></div>
    </div>
  </div>
  <noscript>Enable JavaScript to open your ReignHub workspace.</noscript>
  <script type="module">
    import { mount } from "/console/__LOADER__";
    const config = __NSGO_CONFIG__;
    const root = document.getElementById("workspace");
    const boot = document.getElementById("boot");
    const observer = new MutationObserver(() => {
      if (root.childElementCount) { boot.hidden = true; observer.disconnect(); }
    });
    observer.observe(root, { childList:true });
    try {
      // Compress the Go module for fast delivery and CF's per-asset size limit.
      // The official NSGo loader accepts a precompiled WebAssembly.Module.
      const response = await fetch("/console/" + config.wasm);
      if (!response.ok) throw new Error("Workspace download failed (HTTP " + response.status + ")");
      const module = WebAssembly.compileStreaming(new Response(
        response.body.pipeThrough(new DecompressionStream("gzip")),
        { headers:{ "Content-Type":"application/wasm" } },
      ));
      await mount(root, new URL("/console/nsgo.json", location.origin).href, { config, module });
      window.reignhubReady = true;
    } catch (error) {
      observer.disconnect();
      console.error(error);
      const panel = document.getElementById("boot-error");
      panel.hidden = false;
      panel.querySelector("p").textContent = "Unable to open workspace: " + error.message;
      panel.querySelector("button").onclick = () => location.reload();
      document.querySelector(".console-loading-emblem").hidden = true;
    }
  </script>
</body>
</html>
